name: Ping Supabase (keep alive)

on:
  schedule:
    - cron: "0 8 * * *"   # diario a las 8:00 UTC (Supabase pausa tras 7 días de inactividad)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          PROJECT_REF="jvybembfdefoqnnjnuhq"
          URL="https://${PROJECT_REF}.supabase.co/rest/v1/cot_weekly_raw?select=report_date_as_mm_dd_yyyy&limit=1"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL"             -H "apikey: $SUPABASE_ANON_KEY"             -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "OK: Supabase activo"
            exit 0
          fi

          echo "WARN: Supabase no respondió (status $RESPONSE)"

          if [ -n "$SUPABASE_MGMT_TOKEN" ]; then
            echo "Intentando restaurar via Management API..."
            curl -s -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore"               -H "Authorization: Bearer $SUPABASE_MGMT_TOKEN"               -H "Content-Type: application/json" || true
            echo "Restauración enviada. El proyecto tardará ~2 min en volver."
          else
            echo "WARN: SUPABASE_MGMT_TOKEN no configurado — restauración manual requerida."
          fi

          # Falla el workflow para que el assignee reciba notificación
          exit 1
